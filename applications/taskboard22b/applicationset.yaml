apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard22b-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard22b-api
      - name: taskboard22b-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard22b-gitops
        targetRevision: main
        path: applications/taskboard22b/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard22b-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
